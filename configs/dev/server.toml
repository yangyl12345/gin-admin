[General]
AppName = "ginadmin"
Version = "v10.1.0"
Debug = true
PprofAddr = "" # Pprof monitor address, "localhost:6060"
DisableSwagger = false
DisablePrintConfig = false

[General.HTTP]
Addr = ":8040"
ShutdownTimeout = 10
ReadTimeout = 60
WriteTimeout = 60
IdleTimeout = 10
CertFile = ""
KeyFile = ""

[Storage]

[Storage.DB]
Debug = true
Type = "mysql" # mysql/postgres
# MySQL DSN
DSN = "root:123456@tcp(127.0.0.1:3306)/ginadmin?charset=utf8mb4&parseTime=True&loc=Local"
# PostgreSQL DSN
# DSN = "host=db user=postgres password=123456 dbname=ginadmin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
MaxLifetime = 86400
MaxIdleTime = 3600
MaxOpenConns = 100
MaxIdleConns = 50
TablePrefix = ""
AutoMigrate = true

[Util]

[Util.Prometheus]
Enable = false
Port = 9100
LogApis = [] # Log APIs, e.g. ["/api/v1/shop/products"]
LogMethods = [] # Log HTTP methods, e.g. ["GET"]
DefaultCollect = true

[Shop]
Enable = true

[Shop.JD]
ChromeExecutable = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
UserDataDir = "data/jd-profile"
Headless = false
DebugArtifacts = false
MaxProducts = 1000
PublicWorkers = 4
CheckoutBatch = 20
PublicDelayMin = 1
PublicDelayMax = 3
CheckoutDelayMin = 10
CheckoutDelayMax = 30
NavigationTimeout = 45

[Shop.Scheduler]
DiscoverSpec = "0 */6 * * *"
PublicScanSpec = "*/15 * * * *"
CheckoutSpec = "@every 1m"
CleanupSpec = "0 3 * * *"
AlertDeliverySpec = "@every 5m"

[Shop.ServerChan]
BaseURL = "https://sctapi.ftqq.com"
RequestTimeout = 10

# Agent uses Kimi. When enabled, KIMI_API_KEY and AGENT_API_KEY
# must be supplied through the process environment; never put either secret in
# this file.
[Agent]
Enable = true
MaxUploadBytes = 10485760
ChunkSize = 1800
ChunkOverlap = 200
MaxChunksPerKnowledgeBase = 10000
IndexWorkerConcurrency = 1
MaxIndexAttempts = 3
WorkerPollSeconds = 2
RunTimeoutSeconds = 180
RetrievalTopK = 8
CacheTTLSeconds = 300
EmbeddingModel = "local-hash-v1"
SupervisorModel = "kimi-k2.7-code"
RetrieverModel = "kimi-k2.7-code"
AnswererModel = "kimi-k2.7-code"
ReviewerModel = "kimi-k2.7-code"
