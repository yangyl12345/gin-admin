basePath: /
definitions:
  errors.Error:
    properties:
      code:
        type: integer
      detail:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  schema.JDCategory:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_discovered_at:
        type: string
      last_discovery_error:
        type: string
      last_discovery_status:
        type: string
      max_pages:
        type: integer
      name:
        type: string
      source_url:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  schema.JDCategoryForm:
    properties:
      max_pages:
        maximum: 50
        minimum: 1
        type: integer
      name:
        maxLength: 128
        type: string
      source_url:
        maxLength: 768
        type: string
      status:
        enum:
        - enabled
        - disabled
        type: string
    required:
    - max_pages
    - name
    - source_url
    - status
    type: object
  schema.JDProduct:
    properties:
      alert_state:
        type: string
      canonical_url:
        type: string
      checkout_pending:
        type: boolean
      created_at:
        type: string
      discovery_status:
        type: string
      first_seen_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      last_seen_at:
        type: string
      monitor_status:
        type: string
      name:
        type: string
      next_checkout_at:
        type: string
      self_operated:
        type: boolean
      sku:
        type: string
      updated_at:
        type: string
    type: object
  schema.JDProductForm:
    properties:
      monitor_status:
        enum:
        - active
        - paused
        type: string
    required:
    - monitor_status
    type: object
  schema.JobRun:
    properties:
      created_at:
        type: string
      cursor:
        type: string
      error_summary:
        type: string
      failure_count:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      job_type:
        type: string
      scanned_count:
        type: integer
      started_at:
        type: string
      status:
        type: string
      success_count:
        type: integer
      trigger:
        type: string
      updated_at:
        type: string
    type: object
  schema.NotificationTestResult:
    properties:
      provider:
        type: string
      response:
        type: string
    type: object
  schema.PriceAlert:
    properties:
      baseline_price_fen:
        type: integer
      baseline_price_yuan:
        type: string
      created_at:
        type: string
      current_price_fen:
        type: integer
      current_price_yuan:
        type: string
      drop_basis_points:
        type: integer
      id:
        type: string
      last_error:
        type: string
      product:
        $ref: '#/definitions/schema.JDProduct'
      product_id:
        type: string
      provider_response:
        type: string
      send_attempts:
        type: integer
      send_status:
        type: string
      sent_at:
        type: string
      trigger_sample_id:
        type: string
      updated_at:
        type: string
    type: object
  schema.PriceSample:
    properties:
      collected_at:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      price_fen:
        type: integer
      price_yuan:
        type: string
      product_id:
        type: string
      sample_type:
        type: string
      source:
        type: string
      valid:
        type: boolean
    type: object
  schema.ProductDetail:
    properties:
      alert_state:
        type: string
      canonical_url:
        type: string
      categories:
        items:
          $ref: '#/definitions/schema.JDCategory'
        type: array
      checkout_average_fen:
        type: integer
      checkout_average_yuan:
        type: string
      checkout_pending:
        type: boolean
      created_at:
        type: string
      discovery_status:
        type: string
      first_seen_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      last_seen_at:
        type: string
      latest_checkout_price:
        $ref: '#/definitions/schema.PriceSample'
      latest_public_price:
        $ref: '#/definitions/schema.PriceSample'
      monitor_status:
        type: string
      name:
        type: string
      next_checkout_at:
        type: string
      self_operated:
        type: boolean
      sku:
        type: string
      updated_at:
        type: string
    type: object
  schema.SessionStatus:
    properties:
      authenticated:
        type: boolean
      captcha_blocked:
        type: boolean
      error_summary:
        type: string
      last_checked_at:
        type: string
    type: object
  schema.ShopSetting:
    properties:
      alert_drop_percent:
        type: integer
      candidate_drop_percent:
        type: integer
      created_at:
        type: string
      id:
        type: string
      recovery_drop_percent:
        type: integer
      updated_at:
        type: string
    type: object
  schema.ShopSettingForm:
    properties:
      alert_drop_percent:
        maximum: 90
        minimum: 1
        type: integer
      candidate_drop_percent:
        maximum: 90
        minimum: 1
        type: integer
      recovery_drop_percent:
        maximum: 90
        minimum: 1
        type: integer
    required:
    - alert_drop_percent
    - candidate_drop_percent
    - recovery_drop_percent
    type: object
  schema.Status:
    properties:
      name:
        type: string
      status:
        type: string
    type: object
  util.ResponseResult:
    properties:
      data: {}
      error:
        $ref: '#/definitions/errors.Error'
      success:
        type: boolean
      total:
        type: integer
    type: object
info:
  contact: {}
  description: JD self-operated product price monitoring service based on Gin, GORM
    and Wire DI.
  title: ginadmin
  version: v10.1.0
paths:
  /api/v1/shop/alerts:
    get:
      parameters:
      - default: 1
        description: pagination index
        in: query
        name: current
        required: true
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: product ID
        in: query
        name: productID
        type: string
      - description: pending, sent, or failed
        in: query
        name: sendStatus
        type: string
      - description: start time
        in: query
        name: startTime
        type: string
      - description: end time
        in: query
        name: endTime
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.PriceAlert'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Query price alerts
      tags:
      - ShopAPI
  /api/v1/shop/categories:
    get:
      parameters:
      - default: 1
        description: pagination index
        in: query
        name: current
        required: true
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: category name
        in: query
        name: name
        type: string
      - description: enabled or disabled
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.JDCategory'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Query JD categories
      tags:
      - ShopAPI
    post:
      parameters:
      - description: category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.JDCategoryForm'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.JDCategory'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Create JD category
      tags:
      - ShopAPI
  /api/v1/shop/categories/{id}:
    delete:
      parameters:
      - description: category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Delete JD category
      tags:
      - ShopAPI
    get:
      parameters:
      - description: category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.JDCategory'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get JD category
      tags:
      - ShopAPI
    put:
      parameters:
      - description: category ID
        in: path
        name: id
        required: true
        type: string
      - description: category
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.JDCategoryForm'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Update JD category
      tags:
      - ShopAPI
  /api/v1/shop/jobs:
    get:
      parameters:
      - default: 1
        description: pagination index
        in: query
        name: current
        required: true
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: job type
        in: query
        name: type
        type: string
      - description: job status
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.JobRun'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Query shop job runs
      tags:
      - ShopAPI
  /api/v1/shop/jobs/{type}/run:
    post:
      parameters:
      - description: discover, public-scan, or checkout-sample
        in: path
        name: type
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.JobRun'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Trigger an asynchronous shop job
      tags:
      - ShopAPI
  /api/v1/shop/notifications/test:
    post:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.NotificationTestResult'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Send a ServerChan test notification
      tags:
      - ShopAPI
  /api/v1/shop/products:
    get:
      parameters:
      - default: 1
        description: pagination index
        in: query
        name: current
        required: true
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: JD SKU
        in: query
        name: sku
        type: string
      - description: product name
        in: query
        name: name
        type: string
      - description: category ID
        in: query
        name: categoryID
        type: string
      - description: self-operated
        in: query
        name: selfOperated
        type: boolean
      - description: active or paused
        in: query
        name: monitorStatus
        type: string
      - description: active, stale, or capped
        in: query
        name: discoveryStatus
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.JDProduct'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Query JD products
      tags:
      - ShopAPI
  /api/v1/shop/products/{id}:
    get:
      parameters:
      - description: product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.ProductDetail'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get JD product details
      tags:
      - ShopAPI
    put:
      parameters:
      - description: product ID
        in: path
        name: id
        required: true
        type: string
      - description: monitor status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.JDProductForm'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Pause or resume JD product monitoring
      tags:
      - ShopAPI
  /api/v1/shop/products/{id}/prices:
    get:
      parameters:
      - description: product ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: pagination index
        in: query
        name: current
        required: true
        type: integer
      - default: 10
        description: pagination size
        in: query
        name: pageSize
        required: true
        type: integer
      - description: public or checkout
        in: query
        name: type
        type: string
      - description: start time
        in: query
        name: startTime
        type: string
      - description: end time
        in: query
        name: endTime
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/schema.PriceSample'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Query JD product price history
      tags:
      - ShopAPI
  /api/v1/shop/session:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.SessionStatus'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get JD browser session status
      tags:
      - ShopAPI
  /api/v1/shop/settings:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.ShopSetting'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Get shop monitoring settings
      tags:
      - ShopAPI
    put:
      parameters:
      - description: settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.ShopSettingForm'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ResponseResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ResponseResult'
      summary: Update shop monitoring settings
      tags:
      - ShopAPI
  /api/v1/shop/status:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/util.ResponseResult'
            - properties:
                data:
                  $ref: '#/definitions/schema.Status'
              type: object
      summary: Get shop module status
      tags:
      - ShopAPI
schemes:
- http
- https
swagger: "2.0"
